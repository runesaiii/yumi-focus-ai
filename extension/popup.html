<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Yumi Focus AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🎯 Yumi Focus AI</h1>
    <p class="tagline">Stay focused. Capture distractions.</p>
    <button id="aiConsentBtn" class="btn btn-small btn-secondary" type="button">AI: Loading...</button>
  </header>

  <div id="startSection" class="section">
    <h2>📋 Start a Focus Session</h2>
    <div class="form-group">
      <label for="task">What task are you focusing on?</label>
      <input id="task" type="text" placeholder="e.g., Spreadsheet update" />
    </div>
    
    <div class="form-group">
      <label for="focusMinutes">How long? (minutes)</label>
      <input id="focusMinutes" type="number" min="1" value="25" />
    </div>
    
    <button id="start" class="btn btn-primary">▶ Select Tab & Start Focus</button>
  </div>

  <div id="sessionSection" style="display:none;" class="section active-session">
    <div class="timer-box">
      <p id="timerDisplay" class="timer">⏱ Time left: 25:00</p>
      <p id="sessionStatus" class="status"></p>
    </div>

    <div class="session-controls">
      <h3>⚙️ Session Controls</h3>
      <div class="control-group">
        <input id="adjustMinutes" type="number" placeholder="±min" class="adjust-input" />
        <button id="adjustBtn" class="btn btn-small">Adjust</button>
      </div>

      <button id="pauseBtn" class="btn btn-secondary">⏸ Pause</button>
      <button id="doneBtn" class="btn btn-success">✅ Task Done</button>
    </div>
  </div>

  <section class="queue-section">
    <button id="queueToggleBtn" class="btn btn-queue">📌 Saved Tasks (Click to expand)</button>

    <div id="distractionSection" style="display:none;" class="distraction-panel">
      <h3>💾 Save a Task for Later</h3>
      <div class="form-group">
        <input id="newTask" type="text" placeholder="e.g., Write notes, Reply to Slack" />
        <button id="save" class="btn btn-primary">Save</button>
      </div>

      <div class="queue-list">
        <ul id="queue"></ul>
      </div>
    </div>
  </section>

  <section class="search-section">
    <button id="searchToggleBtn" class="btn btn-queue">🔍 Search History (Beta)</button>
    <div id="searchPanel" style="display:none;" class="search-panel">
      <h3>🔍 Search Historical Tasks</h3>
      <p class="text-muted">Find tasks you've worked on before (when Cosmos DB is configured)</p>
      <div class="form-group">
        <input id="searchQuery" type="text" placeholder="Search tasks, sites, etc." />
        <button id="searchBtn" class="btn btn-primary">Search</button>
      </div>
      <div id="searchResults" class="search-results" style="display:none;">
        <ul id="resultsList"></ul>
      </div>
    </div>
  </section>

  <div id="summarySection" style="display:none;" class="section summary-banner">
    <h3>🏆 Session Summary</h3>
    <p id="summaryText"></p>
    <p id="nextStepText" class="next-step"></p>
    <button id="summaryCloseBtn" class="btn btn-primary">Got it! Next →</button>
  </div>

  <div id="dialogOverlay" class="dialog-overlay" style="display:none;">
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage">
      <div id="dialogBadge" class="dialog-badge"></div>
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <input id="dialogInput" type="text" style="display:none;" />
      <div id="dialogActions" class="dialog-actions"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
